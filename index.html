<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21172d"><title>Pour Louiza ♡</title><style>
:root{font-family:ui-rounded,'Avenir Next',system-ui,sans-serif;color:#fff5f5;background:#21172d}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 80% 5%,#79436e 0,transparent 46%),radial-gradient(ellipse at 0 80%,#53395e 0,transparent 52%),#21172d}body:before{content:'';position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1px);background-size:43px 47px;opacity:.16;animation:drift 20s linear infinite}.shell{position:relative;max-width:520px;margin:auto;min-height:100svh;padding:calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-style:italic;font-size:19px}.pill{border:1px solid #ffffff36;background:#ffffff12;border-radius:50px;color:#ffe8ed;padding:9px 14px;font-size:11px;letter-spacing:.04em}.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:25px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2.2px;color:#ffc7d6;font-weight:700}.hero{font:normal clamp(43px,12vw,66px)/1.12 Georgia,serif;letter-spacing:-1.7px;margin:17px 0}.hero em{color:#ffbfce;font-weight:normal}.desc{font-size:15px;line-height:1.8;color:#ead7e5;margin:10px 0 25px}.mascot{width:132px;height:132px;margin:0 auto 30px;display:grid;place-items:center;font-size:75px;border-radius:50%;background:radial-gradient(circle at 35% 20%,#fff7,#ffc3da18 65%,transparent);box-shadow:0 0 80px #ffa7d03d;animation:float 4s ease-in-out infinite}.button{border:0;border-radius:18px;padding:17px 18px;min-height:54px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .2s,background .2s}.button:active,.choice:active{transform:scale(.97)}.button.primary{background:#ffdce5;color:#4c2a44;box-shadow:0 12px 35px #f7a4bc25}.button.secondary{background:#ffffff16;color:#fff3f5;border:1px solid #ffffff29}.stack{display:grid;gap:11px}.choice{width:100%;border:1px solid #ffffff2c;background:linear-gradient(110deg,#ffffff1c,#ffffff0d);color:#fff4f5;border-radius:20px;display:flex;align-items:center;text-align:left;gap:15px;padding:16px;min-height:76px;cursor:pointer}.choice .emoji{font-size:30px}.choice strong{font-size:14px;display:block}.choice small{font-size:12px;display:block;color:#dcbfce;margin-top:5px}.choice .arrow{margin-left:auto;font-size:21px;color:#f5bacb}.letter{background:linear-gradient(145deg,#fffaf5,#ffe9e8);color:#503447;padding:27px 24px;border-radius:7px 28px 24px 25px;box-shadow:0 24px 70px #10081977;position:relative;animation:unfold .6s cubic-bezier(.2,.8,.2,1) both}.letter:before{content:'✿';position:absolute;right:23px;top:18px;font-size:25px;color:#d5a0b0}.letter .label{color:#a46c86;text-transform:uppercase;font-size:10px;letter-spacing:1.5px;font-weight:700;padding-right:40px}.letter h2{font:italic normal 29px Georgia,serif;color:#824b6b;margin:27px 0 17px}.letter p{font:18px/1.8 Georgia,serif;white-space:pre-line;margin:0}.letter .sign{font:italic 17px Georgia,serif;color:#a36b88;text-align:right;margin-top:28px}.subtle{font-size:12px;line-height:1.7;color:#d6bbcd;text-align:center}.bottom{padding-top:20px;text-align:center;font-size:10px;letter-spacing:1.8px;color:#cba7bf}.screen{animation:appear .4s ease both}.flower{font-size:110px;text-align:center;filter:drop-shadow(0 0 26px #f7b0c75e);animation:float 4s infinite}.count{background:#ffffff12;border:1px solid #ffffff25;border-radius:16px;padding:17px;text-align:center;margin:12px 0 22px}.count strong{font:36px Georgia,serif;color:#ffd1dc;display:block}.back{background:none;border:0;color:#f7cfdd;font-size:13px;padding:12px 0;text-align:left;cursor:pointer}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#fff0e9;color:#54384b;padding:12px 20px;border-radius:30px;z-index:10;box-shadow:0 8px 25px #0005;font-size:13px;white-space:nowrap}.particle{position:fixed;pointer-events:none;z-index:4;animation:burst 1.2s ease-out forwards}.button:focus-visible,.choice:focus-visible,.back:focus-visible{outline:3px solid #fff;outline-offset:3px}@keyframes float{50%{transform:translateY(-12px) rotate(5deg)}}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes unfold{from{opacity:0;transform:translateY(18px) rotate(-2deg) scale(.96)}to{opacity:1;transform:none}}@keyframes drift{to{background-position:43px 47px}}@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(270deg);opacity:0}}@media(min-width:600px){.shell{padding-left:35px;padding-right:35px}.content{padding:50px 0}.letter{padding:43px}.letter p{font-size:21px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><div class="shell"><header class="top"><span class="brand">pour Louiza ♡</span><span class="pill">un petit refuge ✨</span></header><main id="app" class="content" aria-live="polite"></main><footer class="bottom">FAIT AVEC TENDRESSE · JUSTE POUR TOI ♡</footer></div><script>
'use strict';
const themes=[
{icon:'☁️',title:'Quand tu doutes',sub:'Un peu de douceur pour toi',letters:["Louiza, je sais que tu peux être dure avec toi-même. Mais si tu pouvais te regarder une seconde avec les yeux de quelqu’un qui tient à toi, tu verrais tellement plus que tes doutes. Tu n’as rien à prouver aujourd’hui.","Je ne vais pas te sortir une phrase magique. Parfois, on doute, et c’est épuisant. Mais ce que tu ressens maintenant ne dit pas tout de ce que tu es capable de faire. Moi, je crois en toi, même dans les jours flous.","Petit rappel, Louiza : une mauvaise journée ne fait pas de toi une personne moins brillante. Tu as le droit d’apprendre, de te tromper, de recommencer. Ça ne retire rien à ta valeur.","Tu n’es pas obligée de te comparer à tout le monde. Tu as ton histoire, tes envies, ton rythme. Et je trouve ça beau que tu continues à chercher ton chemin."]},
{icon:'🌙',title:'Quand tu es épuisée',sub:'Tu as le droit de ralentir',letters:["Aujourd’hui, je ne te demande pas d’être forte. Bois quelque chose que tu aimes, respire un peu, repose-toi. Les choses importantes pourront attendre quelques heures. Toi aussi, tu mérites qu’on prenne soin de toi.","Louiza, tu n’as pas besoin de rentabiliser chaque minute de ta vie. Tu peux juste écouter une chanson, regarder le plafond, ne rien faire du tout. C’est permis, promis.","Si cette journée t’a vidée, considère ce message comme une autorisation officielle de mettre le monde sur pause. Je t’envoie un câlin à distance et zéro pression.","Je sais que tu essaies beaucoup. Peut-être plus que tu ne le montres. Alors ce soir, ne compte pas ce que tu n’as pas fait. Regarde déjà tout ce que tu as porté."]},
{icon:'🦋',title:'Quand l’avenir t’inquiète',sub:'Un pas après l’autre',letters:["Tu n’as pas besoin de connaître toute la suite, Louiza. La vie ne donne pas le scénario complet dès le début. Choisis juste le prochain petit pas. Pour le reste, on verra en chemin.","Je te souhaite un futur rempli de surprises douces : des rencontres qui font du bien, des projets qui prennent forme, et des matins où tu te dis « finalement, ça valait le coup de continuer ». ","Changer d’avis n’est pas perdre. Prendre son temps n’est pas rater. Tu peux encore inventer plein de versions de ta vie, et j’ai hâte de découvrir celle qui te rendra heureuse.","Tu sais ce que j’espère pour toi ? Pas une vie parfaite. Une vie où tu te sentiras libre, entourée, fière de tes choix et assez sereine pour savourer les petites choses."]},
{icon:'⭐',title:'Pour tes réussites',sub:'Même les toutes petites',letters:["Je veux que tu réalises quelque chose : les efforts que personne ne voit comptent aussi. Les fois où tu as essayé, appris, osé demander de l’aide. Tout ça, c’est du vrai progrès, Louiza.","Promets-moi un truc : la prochaine fois que tu réussis quelque chose, ne réponds pas tout de suite « oh, c’était rien ». Laisse-toi être fière. Même cinq secondes. Tu les mérites.","Tes réussites n’ont pas besoin d’être spectaculaires pour être importantes. Avancer sur un projet, dépasser une peur, te relever après une déception : je trouve ça immense.","Louiza, je ne sais pas exactement où tous tes rêves vont te mener, mais je sais que tu mérites de leur donner une chance. Et quand une bonne nouvelle arrivera, j’espère que tu la fêteras comme il faut !"]},
{icon:'🍓',title:'Pour sourire un peu',sub:'Une mini dose de soleil',letters:["Mission ultra sérieuse : aujourd’hui, trouve une chose ridicule qui te fait rire. Une vidéo de chat, une chanson nulle, un souvenir gênant. Je veux un sourire, même tout petit. C’est un ordre très peu officiel. 🍓","Je déclare officiellement que tu mérites une boisson délicieuse, une playlist parfaite et au moins une bonne surprise cette semaine. Voilà, c’est écrit. Ça doit compter, non ?","Louiza, si ta vie était une série, je réclamerais plus d’épisodes où tu rigoles jusqu’à en avoir mal au ventre. Les scénaristes, faites un effort !","J’espère qu’un jour prochain tu vas rire pour une raison tellement bête que tu n’arriveras même plus à expliquer pourquoi. Ce genre de bonheur-là, c’est précieux."]},
{icon:'💗',title:'Juste parce que c’est toi',sub:'Sans raison particulière',letters:["Louiza, je voulais simplement te dire que je tiens à toi. Pas parce que tu réussis quelque chose, pas parce que tu es toujours de bonne humeur. Juste parce que tu es toi. Et ça me suffit.","Je ne sais pas toujours trouver les bons mots, alors je vais faire simple : je suis content que tu existes dans ma vie. J’espère que tu ne l’oublieras pas les jours compliqués.","Même quand tu n’as pas envie de parler, même quand tu n’as rien d’extraordinaire à raconter, tu comptes. Tu n’as pas besoin d’être une version « meilleure » de toi pour mériter de l’affection.","Si je pouvais glisser une petite pensée dans ta poche pour les jours difficiles, ce serait celle-ci : tu n’es pas seule, Louiza. Il y a des gens qui te souhaitent sincèrement du bien. Moi compris."]}
];
const app=document.getElementById('app');const storage={get(k,fallback){try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};let history=storage.get('louiza_letters_mobile',{});if(!history||typeof history!=='object')history={};let victories=Number(storage.get('louiza_victories_mobile',0))||0;let currentTheme=0,currentLetter=0;
const btn=(label,action,kind='primary')=>`<button type="button" class="button ${kind}" data-action="${action}">${label}</button>`;
function show(html){app.innerHTML=`<div class="screen">${html}</div>`;window.scrollTo({top:0,behavior:'instant'});}
function welcome(){show(`<div class="mascot" aria-hidden="true">💗</div><div class="eyebrow">une surprise rien que pour toi</div><h1 class="hero">Coucou,<br><em>Louiza.</em></h1><p class="desc">J’ai créé ce petit endroit pour te rappeler que tu es importante. Même les jours où tu n’en as pas l’impression.</p><div class="stack">${btn('Ouvre ton petit univers ✨','menu')}</div>`)}
function menu(){show(`<div class="mascot" aria-hidden="true">🌷</div><div class="eyebrow">bienvenue chez toi</div><h1 class="hero">À ton rythme,<br><em>toujours.</em></h1><p class="desc">Pas besoin d’aller bien pour venir ici. Choisis ce qui te ferait du bien aujourd’hui.</p><div class="stack">${btn('💌 Lire une petite lettre','themes')}${btn('🌱 Mon jardin de victoires','garden','secondary')}</div>`)}
function categories(){show(`<button class="back" data-action="menu">← Retour</button><div class="eyebrow">des mots pour tous les jours</div><h1 class="hero" style="font-size:42px">Dis-moi,<br><em>comment ça va ?</em></h1><p class="desc">Choisis ce qui ressemble le plus à ton humeur.</p><div class="stack">${themes.map((t,i)=>`<button class="choice" data-theme="${i}"><span class="emoji">${t.icon}</span><span><strong>${t.title}</strong><small>${t.sub}</small></span><span class="arrow">›</span></button>`).join('')}</div>`)}
function pick(index){currentTheme=index;const total=themes[index].letters.length;let used=Array.isArray(history[index])?history[index].filter(n=>Number.isInteger(n)&&n>=0&&n<total):[];let choices=Array.from({length:total},(_,i)=>i).filter(i=>!used.includes(i));if(!choices.length){used=[];choices=Array.from({length:total},(_,i)=>i)}currentLetter=choices[Math.floor(Math.random()*choices.length)];used.push(currentLetter);history[index]=used;storage.set('louiza_letters_mobile',history);letter()}
function letter(){const t=themes[currentTheme];const text=t.letters[currentLetter];show(`<button class="back" data-action="themes">← Toutes les émotions</button><article class="letter"><div class="label">${t.icon} une lettre rien que pour toi</div><h2>Ma chère Louiza,</h2><p id="letterText"></p><div class="sign">Avec toute mon affection ♡</div></article><div class="stack" style="margin-top:20px">${btn('Une autre lettre, s’il te plaît ✨','again')}${btn('Copier cette lettre ♡','copy','secondary')}</div><p class="subtle">Il y a 4 lettres différentes pour chaque émotion. Elles changent à chaque fois ♡</p>`);document.getElementById('letterText').textContent=text;}
function garden(){const icon=['🌱','🌿','🌷','🌸','💐'][Math.min(4,Math.floor(victories/2))];show(`<button class="back" data-action="menu">← Retour</button><div class="flower">${icon}</div><div class="eyebrow">ton jardin secret</div><h1 class="hero" style="font-size:43px">Chaque petit pas<br><em>compte.</em></h1><p class="desc">Une tâche terminée, un moment de courage, une journée traversée… Tout mérite d’être célébré.</p><div class="count"><strong>${victories}</strong>${victories===1?'petite victoire':'petites victoires'} célébrées ✨</div><div class="stack">${btn('J’ai fait quelque chose aujourd’hui 🌸','win')}</div>`)}
function celebrate(){for(let i=0;i<18;i++){const e=document.createElement('span');e.className='particle';e.textContent=['✦','♡','✿'][i%3];e.style.left='50%';e.style.top='50%';e.style.setProperty('--x',`${(Math.random()-.5)*300}px`);e.style.setProperty('--y',`${(Math.random()-.5)*450}px`);document.body.append(e);setTimeout(()=>e.remove(),1300)}}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2300)}
app.addEventListener('click',async e=>{const category=e.target.closest('[data-theme]');if(category){pick(Number(category.dataset.theme));return}const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='menu')menu();else if(action==='themes')categories();else if(action==='garden')garden();else if(action==='again')pick(currentTheme);else if(action==='win'){victories++;storage.set('louiza_victories_mobile',victories);garden();celebrate()}else if(action==='copy'){const text=`Ma chère Louiza,\n\n${themes[currentTheme].letters[currentLetter]}\n\nAvec toute mon affection ♡`;try{await navigator.clipboard.writeText(text);toast('Lettre copiée ♡')}catch{toast('Sélectionne le texte pour le copier ♡')}}});welcome();
</script></body></html>
